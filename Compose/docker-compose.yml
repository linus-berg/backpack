version: "3.8"
services:
  # Infrastructure
  # required to run container syncs
  bp-prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus.yaml:Z"

  bp-telemetry-otel:
    image: docker.io/otel/opentelemetry-collector-contrib:0.79.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - "./otel.yml:/etc/otel-collector.yaml:Z"
    extra_hosts: ["host.docker.internal:host-gateway"]

  # S3 compatible object storage (SeaweedFS all-in-one "mini" mode).
  #   S3 API:   http://localhost:9000
  #   Admin UI: http://localhost:9001 (login backpack-local / backpack-local)
  # The buckets listed in -bucket are created on startup if they are missing.
  bp-s3:
    image: docker.io/chrislusf/seaweedfs:4.51
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "./volumes/seaweedfs:/data:Z"
    environment:
      # Static S3 credentials (admin identity), used by BP_S3_ACCESS_KEY / BP_S3_SECRET_KEY.
      AWS_ACCESS_KEY_ID: backpack-local
      AWS_SECRET_ACCESS_KEY: backpack-local
    command:
      - mini
      - -dir=/data
      - -bucket=backpack,docker-registry
      - -s3.port=9000
      - -admin.port=9001
      - -admin.user=backpack-local
      - -admin.password=backpack-local
      - -metricsPort=9324
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0

  bp-internal-registry:
    image: docker.io/library/registry:2.8.3
    restart: always
    depends_on:
      - bp-s3
    ports:
      - "6000:5000"
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_ACCESSKEY: backpack-local
      REGISTRY_STORAGE_S3_SECRETKEY: backpack-local
      REGISTRY_STORAGE_S3_REGIONENDPOINT: http://bp-s3:9000
      REGISTRY_STORAGE_S3_BUCKET: docker-registry
      REGISTRY_STORAGE_S3_SECURE: "false"
      REGISTRY_STORAGE_S3_REGION: not-used-for-dev
      REGISTRY_STORAGE_REDIRECT_DISABLE: "true"

  # MongoDB >= 8.0 refuses to start on Linux 6.19 - 7.0.13 (TCMalloc/rseq,
  # https://jira.mongodb.org/browse/SERVER-121912). 7.0 is unaffected. Only bump
  # past 7.0 once the host kernel is >= 7.0.14 (and on 8.0.30+ / 8.3.9+ / 9.x).
  bp-mongo:
    image: docker.io/library/mongo:7.0.45
    restart: always
    ports:
      - 27017:27017
    volumes:
      - "./volumes/mongo_data:/data/db:Z"
      - "./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro,Z"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  bp-keycloak-db:
    image: docker.io/library/postgres:13.23
    volumes:
      - "./volumes/kc_db:/var/lib/postgresql/data:Z"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg123

  bp-keycloak:
    image: quay.io/keycloak/keycloak:20.0.3
    restart: always
    depends_on:
      - bp-keycloak-db
    command:
      - start --proxy edge --hostname-strict=false --hostname-url=http://localhost:8090 --db postgres --db-url-host bp-keycloak-db --db-username pg --db-password pg123 --import-realm
    ports:
      - 8090:8080
    volumes:
      - "./volumes/kc_data:/opt/keycloak/data/h2:Z"
      - "./backpack-realm.json:/opt/keycloak/data/import/backpack-realm.json:Z"
    environment:
      PROXY_ADDRESS_FORWARDING: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

  bp-mongo-express:
    image: docker.io/library/mongo-express:1.0.2
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@bp-mongo:27017/

  bp-ingest-redis:
    image: docker.io/redis/redis-stack:6.2.6-v9
    container_name: bp-ingest-redis
    environment:
      REDIS_ARGS: "--requirepass myverylongpassword"
    volumes:
      - "./volumes/redis_data:/data:Z"
    ports:
      - 6379:6379
      - 8001:8001

  bp-rabbitmq:
    image: docker.io/masstransit/rabbitmq:4.3.1
    container_name: bp-rabbitmq
    ports:
      - 15672:15672
      - 5672:5672
