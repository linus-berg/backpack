# Evaluation stack: the infrastructure Backpack needs plus a minimal Backpack
# (GUI, API, gateway, scheduler, router, the npm processor and the HTTP
# collector). Not hardened for production; see README.md before starting it.
name: backpack-example

services:
  # --- INFRASTRUCTURE ---

  # S3-compatible storage (SeaweedFS all-in-one "mini" mode). The bucket is
  # created on startup; Backpack would also create it on first use.
  s3:
    image: docker.io/chrislusf/seaweedfs:4.51
    restart: always
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # admin UI
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-backpack}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-backpack_pass}
    command:
      - mini
      - -dir=/data
      - -bucket=backpack
      - -s3.port=9000
      - -admin.port=9001
      - -admin.user=${S3_ACCESS_KEY:-backpack}
      - -admin.password=${S3_SECRET_KEY:-backpack_pass}
      - -metricsPort=9324
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    volumes:
      - s3-data:/data
    networks:
      - backpack-network

  mongo:
    image: docker.io/library/mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backpack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-backpack_pass}
    volumes:
      - mongo-data:/data/db
      # Seeds the processor definitions; runs only when the volume is empty.
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backpack-network

  mongo-express:
    image: docker.io/library/mongo-express:1.0.2
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-backpack}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-backpack_pass}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-backpack}:${MONGO_PASS:-backpack_pass}@mongo:27017/
    ports:
      - "8081:8081"
    networks:
      - backpack-network

  # Backpack authenticates as user "default" with BP_REDIS_PASS.
  redis:
    image: docker.io/library/redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASS:-backpack_pass}"]
    networks:
      - backpack-network

  # The MassTransit image ships the delayed message exchange plugin, which
  # Backpack's delayed redelivery needs, and the management plugin, which the
  # Status page uses.
  rabbitmq:
    image: docker.io/masstransit/rabbitmq:4.3.1
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-backpack}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-backpack_pass}
    ports:
      - "15672:15672" # management UI
    networks:
      - backpack-network

  # Browsers and the API must reach Keycloak under the same URL, so add
  # "127.0.0.1 keycloak" to your hosts file (see README.md).
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: always
    command: start-dev --http-port 8090 --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KC_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASS:-backpack_pass}
    ports:
      - "8090:8090"
    volumes:
      - ./backpack-realm.json:/opt/keycloak/data/import/backpack-realm.json:ro
    networks:
      - backpack-network

  # --- BACKPACK ---

  gui:
    image: ghcr.io/linus-berg/backpack/gui:latest
    restart: always
    ports:
      - "3000:80"
    networks:
      - backpack-network

  # The GUI calls the API on port 8004 of the host it was loaded from.
  api:
    image: ghcr.io/linus-berg/backpack/integration/api:latest
    restart: always
    env_file:
      - vars.env
    ports:
      - "8004:8080"
    networks:
      - backpack-network

  gateway:
    image: ghcr.io/linus-berg/backpack/core/gateway:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  scheduler:
    image: ghcr.io/linus-berg/backpack/tracker/scheduler:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  collector-router:
    image: ghcr.io/linus-berg/backpack/collector/router:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  # Processors: one service per ecosystem, each also needs a definition in
  # mongo-init.js (or the GUI's Processors page).
  processor-npm:
    image: ghcr.io/linus-berg/backpack/processor/npm:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  # Collectors: picked by URL scheme. npm tarballs are https:// URLs.
  collector-http:
    image: ghcr.io/linus-berg/backpack/collector/http:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

volumes:
  s3-data:
  mongo-data:

networks:
  backpack-network:
    name: backpack-network
