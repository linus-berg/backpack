version: "3.8"
name: backpack-full-stack

services:
  # --- INFRASTRUCTURE LAYER ---

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-backpack_pass}
    command: server --console-address ":9001" /data
    networks:
      - backpack-network

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-backpack_pass}) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/backpack;
      exit 0;
      "
    networks:
      - backpack-network

  mongo:
    image: mongo:6
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backpack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-backpack_pass}
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backpack-network

  mongo-express:
    image: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-backpack}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-backpack_pass}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-backpack}:${MONGO_PASS:-backpack_pass}@mongo:27017/
    ports:
      - "8081:8081"
    networks:
      - backpack-network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backpack-network

  rabbitmq:
    image: masstransit/rabbitmq:3
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-backpack}
      RABBITMQ_DEFAULT_PASSWORD: ${RABBIT_PASS:-backpack_pass}
    ports:
      - "15672:15672"
    networks:
      - backpack-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: always
    command: start-dev --http-port 8090 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PASS:-backpack_pass}
    ports:
      - "8090:8090"
    volumes:
      - ./backpack-realm.json:/opt/keycloak/data/import/backpack-realm.json:ro
    networks:
      - backpack-network

  # --- BACKPACK CORE SERVICES ---

  gateway:
    image: ghcr.io/backpack/core/gateway:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  api:
    image: ghcr.io/backpack/integration/api:latest
    restart: always
    env_file:
      - vars.env
    ports:
      - "8004:80"
    networks:
      - backpack-network

  scheduler:
    image: ghcr.io/backpack/tracker/scheduler:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  # --- PROCESSORS (Examples) ---

  processor-npm:
    image: ghcr.io/backpack/processor/npm:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  # --- COLLECTORS (Examples) ---

  collector-router:
    image: ghcr.io/backpack/collector/router:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

  collector-http:
    image: ghcr.io/backpack/collector/http:latest
    restart: always
    env_file:
      - vars.env
    networks:
      - backpack-network

networks:
  backpack-network:
    name: backpack-network
