name: Build and Publish
on:
  # run it on push to the default repository branch
  push:
    branches: [master, development]
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
      - '**/*.drawio.svg'
      - 'example/**'
      - 'Compose/**'
  # run it during pull request
  pull_request:

# Jobs get only what they need; see the job's own permissions.
permissions:
  contents: read

jobs:
  # Build every service image; on master and development also push it to
  # GHCR with an SBOM and provenance, and sign it with Sigstore (keyless,
  # through GitHub's OIDC identity). See docs/DeploymentGuide.md for how to
  # verify an image.
  build-and-push-docker-image:
    strategy:
      fail-fast: false
      matrix:
        services:
          - name: processor/rancher
            directory: Processor.Rancher
          - name: integration/api
            directory: Integration.API
          - name: tracker/scheduler
            directory: Tracker.Scheduler
          - name: core/gateway
            directory: Core.Gateway
          - name: git-unpack
            directory: Backpack.GitUnpack
          - name: processor/container
            directory: Processor.Container
          - name: processor/npm
            directory: Processor.Npm
          - name: processor/terraform
            directory: Processor.Terraform
          - name: processor/github-releases
            directory: Processor.Github.Releases
          - name: processor/jetbrains-plugins
            directory: Processor.Jetbrains.Plugins
          - name: processor/jetbrains-ide
            directory: Processor.Jetbrains.IDE
          - name: processor/huggingface
            directory: Processor.HuggingFace
          - name: processor/nuget
            directory: Processor.Nuget
          - name: processor/pypi
            directory: Processor.Pypi
          - name: processor/helm
            directory: Processor.Helm
          - name: collector/http
            directory: Collector.Http
          - name: collector/huggingface
            directory: Collector.Huggingface
          - name: collector/docker-archive
            directory: Collector.DockerArchive
          - name: collector/git
            directory: Collector.Git
          - name: collector/wget
            directory: Collector.Wget
          - name: collector/router
            directory: Collector.Router
          - name: collector/container
            directory: Collector.Container
    name: ${{ matrix.services.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # Sigstore keyless signing
    env:
      IMAGE: ghcr.io/linus-berg/backpack/${{ matrix.services.name }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'development') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published builds get latest and <branch>-<commit>; other builds only a
      # local tag, since branch names like "123/merge" aren't valid tags.
      - name: Image tags
        id: tags
        run: |
          if [ "$PUBLISH" = "true" ]; then
            {
              echo "list<<EOF"
              echo "$IMAGE:latest"
              echo "$IMAGE:$GITHUB_REF_NAME-$GITHUB_SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.services.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          context: .
          file: ./${{ matrix.services.directory }}/Dockerfile
          tags: ${{ steps.tags.outputs.list }}
          push: ${{ env.PUBLISH == 'true' }}
          # Attach an SPDX SBOM and SLSA provenance to the pushed image.
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Image digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
